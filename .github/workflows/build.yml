name: Build

on:
  push:
    branches: [ v10.8.4 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ v10.8.4 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Maven package
      run: mvn clean package -DskipTests -Dbuild.tag=${{ github.ref_name }}
      
    - name: List target files
      run: ls -la target/
      
    - name: Upload package zip
      uses: actions/upload-artifact@v4
      with:
        name: kafka-connect-jdbc-package-${{ github.ref_name }}
        path: target/*-package.zip